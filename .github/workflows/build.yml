name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android лицензи
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия от етикета
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${{ github.run_number }}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Ключ за подписване
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Няма KEYSTORE_BASE64 - ще се подпише с debug ключ"
          fi

      - name: Компилиране
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OS_KEY: ${{ secrets.OS_KEY }}
          OS_USER: ${{ secrets.OS_USER }}
          OS_PASS: ${{ secrets.OS_PASS }}
          SUBDL_KEY: ${{ secrets.SUBDL_KEY }}
          SUBSOURCE_KEY: ${{ secrets.SUBSOURCE_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Преименуване
        run: cp app/build/outputs/apk/release/*.apk TorrTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TorrTV
          path: TorrTV.apk

      - name: Публикуване на издание
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TorrTV.apk
          generate_release_notes: true
