name: Build APK

# main: тестове, подписан APK и издание (приложението се обновява от него).
# Всеки друг клон: само компилация и тестове - без подписване и без издание, за да се провери промяна, преди да стигне до потребителите.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android лицензи
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ за подписване
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Липсва $name. Публикуването изисква постоянния release ключ."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Компилиране
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PappVersionName=1.0.${{ github.run_number }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Компилиране (проверка на клон, без издание)
        if: github.ref != 'refs/heads/main'
        # Release е неподписан, но минава през R8 като истинското издание; debug APK е за проба на телевизора.
        run: bash gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug

      - name: Тестов APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TorrTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Преименуване
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/release/app-release.apk TorrTV.apk

      - name: Резултати от тестовете
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in Path('app/build/test-results').rglob('TEST-*.xml'):
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      continue
                  message = f"{case.get('classname')}.{case.get('name')}: {failure.get('message', 'failed')}"[:2500]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error::{message}')
          print(f"::notice::Android tests: {totals['tests']}, failures: {totals['failures']}, errors: {totals['errors']}, skipped: {totals['skipped']}")
          PY

      - name: Публикуване на издание
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TorrTV 1.0.${{ github.run_number }}
          files: TorrTV.apk
          generate_release_notes: true
